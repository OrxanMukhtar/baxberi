<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baxberi — canlı yayım</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1b1b1f;--mu:#6b6b76;--bd:#e3e1db;--ac:#ff2d55}
@media (prefers-color-scheme:dark){:root{--bg:#0f0f13;--card:#1a1a21;--tx:#f2f2f5;--mu:#9a9aa6;--bd:#2a2a33}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-weight:800;font-size:20px;color:var(--ac);cursor:pointer}.sp{flex:1}.mu{color:var(--mu)}
button{font:inherit;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;cursor:pointer;font-weight:600}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%}
main{max-width:1000px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.u{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 10px;text-align:center;cursor:pointer;position:relative}
.u:hover{border-color:var(--ac)}.av{font-size:44px;line-height:1}
.u b{display:block;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{position:absolute;top:8px;right:8px;background:var(--ac);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px}
.box{max-width:340px;margin:60px auto;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;display:grid;gap:12px}
.box h2{margin:0}.err{color:var(--ac);min-height:1.2em}
.w{display:grid;grid-template-columns:1fr 320px;gap:14px}
@media(max-width:760px){.w{grid-template-columns:1fr}}
.stage{background:#000;border-radius:14px;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;color:#aaa;overflow:hidden;text-align:center;padding:8px}
.stage video{width:100%;height:100%;object-fit:contain}
.chat{background:var(--card);border:1px solid var(--bd);border-radius:14px;display:flex;flex-direction:column;height:420px}
.msgs{flex:1;overflow-y:auto;padding:10px;display:grid;gap:6px;align-content:start}
.msgs div{word-break:break-word}.msgs b{color:var(--ac)}
.cf{display:flex;gap:6px;padding:8px;border-top:1px solid var(--bd)}
.hd{display:flex;align-items:center;gap:10px;margin:10px 0}
.profile{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden;margin:12px 0}.cover{height:150px;background:linear-gradient(120deg,#ff2d55,#ff9f43) center/cover}.pbody{padding:16px}.pav{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid var(--card);margin-top:-48px;background:var(--card)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.actions button{padding:8px 11px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.formgrid .wide{grid-column:1/-1}.u img{width:58px;height:58px;border-radius:50%;object-fit:cover}.status{font-size:12px;color:var(--mu)}
@media(max-width:520px){main{padding:10px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cover{height:110px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}.chat{height:48vh}header{padding:9px 10px}}
</style></head><body>
<header><span class="logo" id="logo">● Baxberi</span><span class="sp"></span><span id="net" class="mu"></span><span id="who" class="mu"></span>
<button id="profileBtn" class="g" hidden>Profilim</button><button id="gl" class="g" hidden>📹 Yayım aç</button><button id="lo" class="g" hidden>Çıxış</button></header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s), app = $('#app');
const EM = ['😀','😎','🦊','🐼','🐯','🦄','🐙','🌸','🚀','🎸','🍉','👾'];
const av = n => EM[[...n].reduce((a, c) => a + c.charCodeAt(0), 0) % EM.length];
const el = (t, p = {}, ...k) => { const e = document.createElement(t); Object.assign(e, p); e.append(...k); return e; };
async function api(p, b) {
  let r;
  try {
    r = await fetch('/api/' + p, { method: b ? 'POST' : 'GET', headers: { 'Content-Type': 'application/json' }, body: b ? JSON.stringify(b) : undefined });
  } catch { throw new Error('Serverlə əlaqə yoxdur.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Xəta baş verdi.');
  return j;
}
let me = null, ws = null, dup = false, online = [], view = null, asked = null, pendIce = [];
let stream = null, pcs = {}, vpc = null, live = false, ice = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const send = o => { if (ws && ws.readyState === 1) { ws.send(JSON.stringify(o)); return true; } return false; };

function authView() {
  let mode = 'login', busy = false;
  const nm = el('input', { placeholder: 'İstifadəçi adı', maxLength: 20, autocomplete: 'username' });
  const pw = el('input', { type: 'password', placeholder: 'Şifrə (min. 6 simvol)', autocomplete: 'current-password' });
  const err = el('div', { className: 'err' }), h = el('h2', { textContent: 'Giriş' });
  const ok = el('button', { textContent: 'Daxil ol' });
  const sw = el('a', { href: '#', textContent: 'Hesabın yoxdur? Qeydiyyatdan keç' });
  sw.onclick = e => {
    e.preventDefault(); mode = mode === 'login' ? 'register' : 'login';
    h.textContent = mode === 'login' ? 'Giriş' : 'Qeydiyyat';
    ok.textContent = mode === 'login' ? 'Daxil ol' : 'Qeydiyyatdan keç';
    pw.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
    sw.textContent = mode === 'login' ? 'Hesabın yoxdur? Qeydiyyatdan keç' : 'Hesabın var? Daxil ol'; err.textContent = '';
  };
  const go = async () => {
    if (busy) return; busy = true; ok.disabled = true; err.textContent = '';
    try { me = (await api(mode, { username: nm.value.trim(), password: pw.value })).user; }
    catch (e) { err.textContent = e.message; busy = false; ok.disabled = false; return; }
    boot();
  };
  ok.onclick = go;
  pw.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  nm.addEventListener('keydown', e => { if (e.key === 'Enter') pw.focus(); });
  app.replaceChildren(el('div', { className: 'box' }, h, nm, pw, err, ok, sw));
  nm.focus();
}
function boot() {
  $('#who').textContent = av(me.username) + ' ' + me.name; $('#gl').hidden = $('#lo').hidden = $('#profileBtn').hidden = false;
  api('ice').then(j => { if (j.iceServers) ice = j; }).catch(() => {});
  connect(); home();
}
function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  const mine = ws;
  ws.onopen = () => {
    $('#net').textContent = '';
    if (view) send({ t: 'watch', to: view });
    if (live) send({ t: 'live', on: true, title: stream && stream._title });
  };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === 'online') { online = m.list; view ? refreshStage() : home(); }
    else if (m.t === 'history' && m.ch === view) { const b = $('#ms'); if (b) b.replaceChildren(); m.msgs.forEach(addMsg); }
    else if (m.t === 'chat' && m.ch === view) addMsg(m.msg);
    else if (m.t === 'sig') onSig(m).catch(console.error);
    else if (m.t === 'dup') {
      dup = true; stopStream(); closeV();
      app.replaceChildren(el('div', { className: 'box' }, 'Hesaba başqa yerdən daxil olundu. Burada davam etmək üçün səhifəni yeniləyin.'));
    }
  };
  ws.onclose = () => { if (mine !== ws || !me || dup) return; $('#net').textContent = 'Bağlantı kəsildi, yenidən qoşulur…'; setTimeout(connect, 2000); };
}
function home() {
  if (!me || dup) return;
  if (view) { view = null; asked = null; closeV(); send({ t: 'watch', to: null }); }
  const cards = online.map(u => {
    const c = el('div', { className: 'u' }, u.avatar ? el('img', { src:u.avatar, alt:'Avatar' }) : el('div', { className: 'av', textContent: av(u.u) }),
      el('b', { textContent: u.name + (u.u === me.username ? ' (sən)' : '') }),
      el('small', { className: 'mu', textContent: u.live ? (u.title || 'Canlı yayımda') : 'onlayn' }));
    if (u.live) c.prepend(el('span', { className: 'badge', textContent: 'CANLI' }));
    c.onclick = () => openView(u.u); return c;
  });
  const nodes = [el('h3', { textContent: 'Hazırda onlayn: ' + online.length }), el('div', { className: 'grid' }, ...cards)];
  if (online.length < 2) nodes.push(el('p', { className: 'mu', textContent: 'Başqa istifadəçilər qoşulduqda burada görünəcək.' }));
  app.replaceChildren(...nodes);
}
function openView(u) {
  view = u; asked = null; closeV(); send({ t: 'watch', to: u });
  const o = online.find(x => x.u === u) || { name: u };
  const ci = el('input', { placeholder: 'Mesaj yaz...', maxLength: 200 }), cs = el('button', { textContent: '↑' });
  const sendMsg = () => {
    const t = ci.value.trim(); if (!t) return;
    if (send({ t: 'chat', ch: view, text: t })) ci.value = ''; else $('#net').textContent = 'Bağlantı yoxdur, mesaj göndərilmədi.';
  };
  cs.onclick = sendMsg; ci.addEventListener('keydown', e => { if (e.key === 'Enter') sendMsg(); });
  const back = el('button', { className: 'g', textContent: '← Geri' }); back.onclick = home;
  app.replaceChildren(back,
    el('div', { className: 'hd' }, el('span', { className: 'av', style: 'font-size:34px', textContent: av(u) }),
      el('div', {}, el('b', { textContent: o.name }), el('div', { className: 'mu', id: 'vc' }))),
    el('div', { className: 'w' }, el('div', { className: 'stage', id: 'st' }),
      el('div', { className: 'chat' }, el('div', { className: 'msgs', id: 'ms' }), el('div', { className: 'cf' }, ci, cs))));
  profileCard(u);
  if (u === me.username && stream) { const v = el('video', { muted: true, autoplay: true, playsInline: true }); v.srcObject = stream; $('#st').append(v); }
  refreshStage();
}
async function profileCard(u){try{const d=await api('profile?u='+encodeURIComponent(u));if(view!==u)return;const p=d.profile,card=el('section',{className:'profile'}),cover=el('div',{className:'cover'});if(p.cover)cover.append(el('img',{src:p.cover,alt:'',style:'width:100%;height:100%;object-fit:cover'}));const avatar=p.avatar?el('img',{className:'pav',src:p.avatar,alt:'Avatar'}):el('div',{className:'pav av',textContent:av(u)});const actions=el('div',{className:'actions'});if(u!==me.username){const f=el('button',{className:'g',textContent:d.following?'✓ İzlənilir':'＋ İzləyirəm'});f.onclick=async()=>{const x=await api('follow',{username:u});f.textContent=x.following?'✓ İzlənilir':'＋ İzləyirəm'};actions.append(f);for(const emoji of ['❤️','😂','👏','🔥','😍']){const b=el('button',{className:'g',textContent:emoji});b.onclick=()=>api('reaction',{username:u,emoji});actions.append(b)}const gift=el('button',{className:'g',textContent:'🎁 Hədiyyə'});gift.onclick=async()=>{const g=prompt('Hədiyyə emojisi:', '🎁');if(g)await api('gift',{username:u,gift:g})};actions.append(gift)}
 if(u!==me.username){const quiz=el('button',{className:'g',textContent:'🧠 Mini-quiz'});quiz.onclick=()=>{const qs=[['Ən böyük okean hansıdır?','Sakit okean'],['Günəş sistemində ən böyük planet?','Yupiter'],['Azərbaycanın paytaxtı?','Bakı']];const [q,a]=qs[Math.floor(Math.random()*qs.length)];if(send({t:'chat',ch:u,text:`🧠 Mini-quiz: ${q} Cavab: ${a}`})){}else alert('Çat bağlantısı yoxdur.');};actions.append(quiz)}
 const detail=el('div',{className:'pbody'},avatar,el('h2',{textContent:p.displayName}),el('div',{className:'mu',textContent:'@'+p.username+' · '+p.status}),el('p',{textContent:p.bio}),el('div',{className:'mu',textContent:[p.age&&`${p.age} yaş`,p.city].filter(Boolean).join(' · ')}),el('p',{textContent:(p.interests||[]).join(' · ')}),actions);card.append(cover,detail);if(u===me.username){const edit=el('button',{textContent:'Profili redaktə et'});edit.onclick=editProfile;detail.append(edit);(d.visitors||[]).length&&detail.append(el('p',{className:'mu',textContent:'Son ziyarətçilər: '+d.visitors.map(v=>v.profile.displayName).join(', ')}))}const stage=$('#st')?.parentElement;if(stage)stage.before(card)}catch(e){console.error(e)}}
async function editProfile(){try{const p=(await api('profile')).profile;const panel=el('div',{className:'box',style:'max-width:600px;margin:12px auto'}), fields={};for(const [key,label] of [['displayName','Görünən ad'],['bio','Bio'],['age','Yaş'],['city','Şəhər'],['interests','Maraqlar və hobbilər (vergüllə)']]){const i=el(key==='bio'?'textarea':'input',{placeholder:label,value:key==='interests'?(p.interests||[]).join(', '):(p[key]||'')});i.setAttribute('aria-label',label);fields[key]=i;panel.append(i)}const status=el('select',{});for(const [v,t] of [['available','Aktiv'],['busy','Məşğul'],['looking','Yeni tanışlıqlar'],['offline','Gizli']])status.append(el('option',{value:v,textContent:t}));status.value=p.status;panel.append(status);let avatar=p.avatar,cover=p.cover;for(const [label,key] of [['Avatar','avatar'],['Cover','cover']]){const input=el('input',{type:'file',accept:'image/png,image/jpeg,image/webp,image/gif'});input.setAttribute('aria-label',label+' şəkli, maksimum 2 MB');input.onchange=async()=>{if(input.files[0]){const r=new FileReader();r.onload=async()=>{try{const out=await api('upload',{image:r.result});if(key==='avatar')avatar=out.url;else cover=out.url}catch(e){alert(e.message)}};r.readAsDataURL(input.files[0])}};panel.append(el('label',{textContent:label}),input)}const msg=el('div',{className:'err'}),save=el('button',{textContent:'Yadda saxla'});save.onclick=async()=>{try{await api('profile',{displayName:fields.displayName.value,bio:fields.bio.value,age:fields.age.value,city:fields.city.value,interests:fields.interests.value.split(',').map(x=>x.trim()).filter(Boolean),status:status.value,avatar,cover});if(view===me.username){home()}else profileCard(me.username)}catch(e){msg.textContent=e.message}};panel.append(msg,save);app.prepend(panel)}catch(e){alert(e.message)}}
function addMsg(m) {
  const box = $('#ms'); if (!box) return;
  box.append(el('div', {}, el('b', { textContent: m.u }), ' ' + m.text)); box.scrollTop = box.scrollHeight;
}
function refreshStage() {
  const st = $('#st'); if (!st) return;
  const u = online.find(x => x.u === view);
  $('#vc').textContent = (u && u.live ? '🔴 Canlı · ' : '') + (u ? u.viewers : 0) + ' izləyici';
  if (view === me.username) { if (!stream) st.textContent = 'Yayım açmaq üçün yuxarıdakı düyməni bas.'; return; }
  if (u && u.live) {
    if (asked !== view) { asked = view; st.textContent = 'Bağlanır...'; send({ t: 'sig', to: view, d: { k: 'join' } }); }
  } else { asked = null; closeV(); st.textContent = 'Bu istifadəçi hazırda yayımda deyil. Söhbət yaza bilərsən.'; }
}
function closeV() { if (vpc) { vpc.close(); vpc = null; } pendIce = []; }

// ---------- WebRTC ----------
const addIce = (pc, c) => pc.remoteDescription ? pc.addIceCandidate(c).catch(() => {}) : (pc._q = pc._q || []).push(c);
const flush = pc => { (pc._q || []).forEach(c => pc.addIceCandidate(c).catch(() => {})); pc._q = []; };
async function onSig({ from, d }) {
  if (d.k === 'join' && live && stream) {
    if (pcs[from]) pcs[from].close();
    const pc = pcs[from] = new RTCPeerConnection(ice);
    stream.getTracks().forEach(t => pc.addTrack(t, stream));
    pc.onicecandidate = e => e.candidate && send({ t: 'sig', to: from, d: { k: 'ice', c: e.candidate } });
    pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(pc.connectionState) && pcs[from] === pc) delete pcs[from]; };
    await pc.setLocalDescription(await pc.createOffer());
    send({ t: 'sig', to: from, d: { k: 'offer', s: pc.localDescription } });
  } else if (d.k === 'offer' && from === view) {
    closeV(); const pc = vpc = new RTCPeerConnection(ice);
    pc.onicecandidate = e => e.candidate && send({ t: 'sig', to: from, d: { k: 'ice', c: e.candidate } });
    pc.ontrack = e => {
      const st = $('#st'); if (!st) return; let v = st.querySelector('video');
      if (!v) { st.textContent = ''; v = el('video', { autoplay: true, playsInline: true, controls: true }); st.append(v); }
      v.srcObject = e.streams[0]; v.play().catch(() => {});
    };
    pc.onconnectionstatechange = () => {
      if (pc === vpc && pc.connectionState === 'failed') { const st = $('#st'); if (st) { st.textContent = 'Video bağlantısı alınmadı (şəbəkə). Geri qayıdıb yenidən yoxla.'; } }
    };
    await pc.setRemoteDescription(d.s);
    pendIce.splice(0).forEach(c => addIce(pc, c)); flush(pc);
    await pc.setLocalDescription(await pc.createAnswer());
    send({ t: 'sig', to: from, d: { k: 'answer', s: pc.localDescription } });
  } else if (d.k === 'answer' && pcs[from]) { await pcs[from].setRemoteDescription(d.s); flush(pcs[from]); }
  else if (d.k === 'ice') {
    if (pcs[from]) addIce(pcs[from], d.c);
    else if (from === view) { vpc ? addIce(vpc, d.c) : pendIce.push(d.c); }
  }
}
function stopStream() {
  live = false; if (stream) stream.getTracks().forEach(t => t.stop()); stream = null;
  Object.values(pcs).forEach(p => p.close()); pcs = {};
  $('#gl').textContent = '📹 Yayım aç';
}
async function toggleLive() {
  if (live) { stopStream(); send({ t: 'live', on: false }); return home(); }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { alert('Kamera yalnız HTTPS ünvanında (və ya localhost-da) işləyir.'); return; }
  try { stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true }); }
  catch { alert('Kameraya/mikrofona icazə verilmədi və ya cihaz tapılmadı.'); return; }
  stream._title = prompt('Yayım başlığı:', '') || ''; live = true;
  $('#gl').textContent = '⏹ Yayımı bitir'; send({ t: 'live', on: true, title: stream._title }); openView(me.username);
}
$('#gl').onclick = toggleLive; $('#logo').onclick = home;
$('#profileBtn').onclick=()=>{openView(me.username);setTimeout(editProfile,100)};
$('#lo').onclick = async () => { try { await api('logout', {}); } catch {} location.reload(); };
api('me').then(j => { me = j.user; }, () => { me = null; }).then(() => me ? boot() : authView());
</script></body></html>
