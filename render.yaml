services:
  - type: web
    name: baxberi
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_R2_BUCKET
        value: baxberi-profile-images
      - key: CF_API_TOKEN
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: TURN_URL
        sync: false
      - key: TURN_SECRET
        sync: false
